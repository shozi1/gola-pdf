# ==============================================================================
# Gola PDF - High Performance Nginx Reverse Proxy Configuration
# Ready for Hostinger VPS / Ubuntu Linux with Let's Encrypt Certbot SSL
# ==============================================================================

server {
    listen 80;
    server_name golapdf.com www.golapdf.com; # Replace with your purchased domain

    # Max upload size for multi-file PDF batch processing (250 MB)
    client_max_body_size 250M;

    # Gzip Compression for maximum speed and lower bandwidth
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    # Timeouts for heavy OCR scanning and multi-file conversions
    proxy_connect_timeout 300s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;
    send_timeout 300s;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Disable buffering for smooth streaming of downloads
        proxy_buffering off;
    }
}
